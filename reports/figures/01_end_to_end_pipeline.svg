<rect x="630.0" y="618.0" width="300.0" height="58.0" rx="5" fill="#E7EDF5" stroke="#3A5A80" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="780.0" y="643.5" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Opportunity scoring</text>
<text x="780.0" y="661.5" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">impact and feasibility kept separate</text>
<line x1="780.0" y1="586.0" x2="780.0" y2="611.0" stroke="#44586B" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)"/>
