<text x="780.0" y="733.5" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Sensitivity &amp; robustness</text>
<text x="780.0" y="751.5" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">weighting · instrumentation · merge threshold</text>
<line x1="780.0" y1="676.0" x2="780.0" y2="701.0" stroke="#44586B" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)"/>
<rect x="90.0" y="620.0" width="300.0" height="130.0" rx="4" fill="#F7F9FB" stroke="#D3DCE4" stroke-width="1"/>
<text x="240.0" y="661.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5A5A5A" font-style="italic">Segmentation is an imperfect measurement</text>
<text x="240.0" y="675.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5A5A5A" font-style="italic">layer, not business truth. Dataset A</text>
<text x="240.0" y="689.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5A5A5A" font-style="italic">quantifies how imperfect it is; Dataset B</text>
<text x="240.0" y="703.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5A5A5A" font-style="italic">inherits that uncertainty and never claims</text>
<text x="240.0" y="717.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5A5A5A" font-style="italic">segment-level correctness.</text>
<rect x="360.0" y="816.0" width="300.0" height="58.0" rx="5" fill="#FAF0E2" stroke="#A9791C" stroke-width="1.4"/>
<text x="510.0" y="835.0" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Automation recommendation</text>
<text x="510.0" y="853.0" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">evidence-led; the score is corroboration, not</text>
<text x="510.0" y="866.0" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">foundation</text>
<rect x="360.0" y="906.0" width="300.0" height="58.0" rx="5" fill="#F0EAF5" stroke="#6B4E8C" stroke-width="1.4"/>
<text x="510.0" y="931.5" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Working automation prototype</text>
<text x="510.0" y="949.5" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">bounded scope · mandatory human checkpoint</text>
