<rect width="1020" height="1010" fill="#FFFFFF"/>
<text x="40.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1A1A1A">Figure 1 — End-to-end evidence pipeline</text>
<text x="40.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#5A5A5A">Raw desktop telemetry to a bounded automation prototype. Dataset A validates the method; Dataset B carries the analysis.</text>
