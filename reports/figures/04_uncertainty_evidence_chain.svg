<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="760" viewBox="0 0 1020 760">
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 1 L 9 5 L 0 9 z" fill="#44586B"/>
</marker>
<marker id="greyhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 1 L 9 5 L 0 9 z" fill="#9A9A9A"/>
</marker>
</defs>
<rect width="1020" height="760" fill="#FFFFFF"/>
<text x="40.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1A1A1A">Figure 4 — How uncertainty is carried forward, not hidden</text>
<text x="40.0" y="53.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#5A5A5A">Each stage is labelled with what it is actually worth as evidence.</text>
<rect x="60.0" y="84.0" width="430.0" height="54.0" rx="5" fill="#EDF2F7" stroke="#2C3E50" stroke-width="1.4"/>
<text x="275.0" y="107.5" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Raw telemetry</text>
<text x="275.0" y="125.5" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">desktop operation logs, as recorded</text>
<rect x="560.0" y="100.0" width="76.0" height="22" rx="11" fill="#FFFFFF" stroke="#3F7A52" stroke-width="1.3"/>
<text x="598.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3F7A52">MEASURED</text>
<text x="650.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5A5A5A">Directly observed events.</text>
<rect x="60.0" y="162.0" width="430.0" height="54.0" rx="5" fill="#E8F1EA" stroke="#3F7A52" stroke-width="1.4"/>
<text x="275.0" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Segmentation — Dataset A</text>
<text x="275.0" y="203.5" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">validated against 2,009 labelled executions</text>
<line x1="275.0" y1="138.0" x2="275.0" y2="155.0" stroke="#44586B" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="560.0" y="178.0" width="76.0" height="22" rx="11" fill="#FFFFFF" stroke="#3F7A52" stroke-width="1.3"/>
<text x="598.0" y="193.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3F7A52">MEASURED</text>
<text x="650.0" y="193.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5A5A5A">Quantified against ground truth.</text>
<rect x="60.0" y="240.0" width="430.0" height="54.0" rx="5" fill="#FDF3E7" stroke="#C2700F" stroke-width="1.4"/>
<text x="275.0" y="263.5" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Segmentation uncertainty</text>
<text x="275.0" y="281.5" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">F1 0.3440 · 79.05% of executions fragmented</text>
<line x1="275.0" y1="216.0" x2="275.0" y2="233.0" stroke="#44586B" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="560.0" y="256.0" width="76.0" height="22" rx="11" fill="#FFFFFF" stroke="#3F7A52" stroke-width="1.3"/>
<text x="598.0" y="271.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3F7A52">MEASURED</text>
<text x="650.0" y="271.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5A5A5A">The limitation is known and sized.</text>
<rect x="60.0" y="318.0" width="430.0" height="54.0" rx="5" fill="#E7EDF5" stroke="#3A5A80" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="275.0" y="341.5" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Segmentation — Dataset B</text>
<text x="275.0" y="359.5" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">same method, different data, no labels</text>
<line x1="275.0" y1="294.0" x2="275.0" y2="311.0" stroke="#44586B" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)"/>
<rect x="560.0" y="334.0" width="125.0" height="22" rx="11" fill="#FFFFFF" stroke="#B23A2F" stroke-width="1.3"/>
<text x="622.5" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#B23A2F">NOT VALIDATABLE</text>
<text x="699.0" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5A5A5A">No ground truth exists. Correctness cannot be checked.</text>
<rect x="60.0" y="396.0" width="430.0" height="54.0" rx="5" fill="#E8F1EA" stroke="#3F7A52" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="275.0" y="419.5" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Process-level aggregation</text>
<text x="275.0" y="437.5" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">counts · handling time · operators · variants</text>
<line x1="275.0" y1="372.0" x2="275.0" y2="389.0" stroke="#44586B" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)"/>
<rect x="560.0" y="412.0" width="76.0" height="22" rx="11" fill="#FFFFFF" stroke="#3F7A52" stroke-width="1.3"/>
<text x="598.0" y="427.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3F7A52">MEASURED</text>
<text x="650.0" y="427.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5A5A5A">Aggregates are directly counted from the executions.</text>
<rect x="60.0" y="474.0" width="430.0" height="54.0" rx="5" fill="#E7EDF5" stroke="#3A5A80" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="275.0" y="497.5" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Opportunity analysis</text>
<text x="275.0" y="515.5" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">impact x feasibility over 21 processes</text>
<line x1="275.0" y1="450.0" x2="275.0" y2="467.0" stroke="#44586B" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)"/>
<rect x="560.0" y="490.0" width="76.0" height="22" rx="11" fill="#FFFFFF" stroke="#A9791C" stroke-width="1.3"/>
<text x="598.0" y="505.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#A9791C">INFERRED</text>
<text x="650.0" y="505.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5A5A5A">Depends on weighting choices; shown to be fragile.</text>
<rect x="60.0" y="552.0" width="430.0" height="54.0" rx="5" fill="#E8F1EA" stroke="#3F7A52" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="275.0" y="575.5" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Sensitivity analysis</text>
<text x="275.0" y="593.5" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">weightings · merge thresholds · degraded sessions</text>
<line x1="275.0" y1="528.0" x2="275.0" y2="545.0" stroke="#44586B" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#head)"/>
<rect x="560.0" y="568.0" width="76.0" height="22" rx="11" fill="#FFFFFF" stroke="#3F7A52" stroke-width="1.3"/>
<text x="598.0" y="583.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3F7A52">MEASURED</text>
<text x="650.0" y="583.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5A5A5A">Evidence layer stable; score layer sensitive.</text>
<rect x="60.0" y="630.0" width="430.0" height="54.0" rx="5" fill="#FAF0E2" stroke="#A9791C" stroke-width="1.4"/>
<text x="275.0" y="653.5" font-family="Helvetica, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1A1A1A">Recommendation confidence</text>
<text x="275.0" y="671.5" font-family="Helvetica, Arial, sans-serif" font-size="11.0" text-anchor="middle" fill="#5A5A5A">qualified, and stated as qualified</text>
<line x1="275.0" y1="606.0" x2="275.0" y2="623.0" stroke="#44586B" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="560.0" y="646.0" width="76.0" height="22" rx="11" fill="#FFFFFF" stroke="#A9791C" stroke-width="1.3"/>
<text x="598.0" y="661.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#A9791C">INFERRED</text>
<text x="650.0" y="661.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5A5A5A">Rests on the stable evidence, not on the fragile score.</text>
<rect x="60.0" y="712.0" width="900.0" height="44.0" rx="4" fill="#F7F9FB" stroke="#D3DCE4" stroke-width="1"/>
<text x="510.0" y="731.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5A5A5A" font-style="italic">Dataset B segmentation is never claimed to be correct. The recommendation is a comparative judgement built on aggregate evidence, which survives</text>
<text x="510.0" y="745.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5A5A5A" font-style="italic">uncertainty that a per-segment correctness claim would not.</text>
</svg>
